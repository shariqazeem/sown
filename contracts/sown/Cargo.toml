[package]
name = "sown"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Send money home. Part of it stays theirs: the envelope contract."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
