[workspace]
resolver = "2"
members = ["contracts/sown"]

[workspace.dependencies]
# The same release line as stellar-cli 28.1.0. Move both to 29 together (CLAUDE.md §5).
soroban-sdk = "28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
